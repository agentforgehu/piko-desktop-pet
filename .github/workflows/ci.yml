name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - run: dotnet restore Piko.sln
      - run: dotnet build Piko.sln -c Release --no-restore
      - run: dotnet test Piko.sln -c Release --no-build
      - name: Verify VS Code bridge
        working-directory: integrations/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run compile
          npm run package
