name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - run: dotnet restore Piko.sln
      - run: dotnet build Piko.sln -c Release --no-restore
      - run: dotnet test Piko.sln -c Release --no-build
      - name: Verify VS Code bridge
        working-directory: integrations/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run compile
          npm run package
