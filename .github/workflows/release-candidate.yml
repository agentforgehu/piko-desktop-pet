name: Release candidate validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: startsWith(github.head_ref, 'codex/1.0-') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify, build and test
        shell: pwsh
        run: |
          ./scripts/check-version-sync.ps1
          dotnet build Piko.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Piko.sln -c Release --no-build --logger trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render and check WPF layouts
        shell: pwsh
        run: |
          dotnet src/Piko.Desktop/bin/Release/net8.0-windows/Piko.dll --ui-smoke-test --data-dir "$env:RUNNER_TEMP/piko-ui"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content "$env:RUNNER_TEMP/piko-ui/ui-evidence.json" -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'WPF layout checks failed' }
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Piko-1.0-UI-evidence
          path: ${{ runner.temp }}/piko-ui/
          if-no-files-found: ignore
      - name: Package unsigned preview candidate
        shell: pwsh
        run: ./scripts/publish.ps1 -Channel preview
      - name: Verify installation lifecycle
        shell: pwsh
        run: ./scripts/verify-installation.ps1
      - name: Thirty minute stability gate
        shell: pwsh
        run: ./scripts/stability.ps1 -DurationSeconds 1800
      - name: Upload candidate and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Piko-1.0-UNSIGNED-CANDIDATE
          path: |
            releases/*.zip
            releases/*-Setup.exe
            releases/*.vsix
            releases/*.json
            releases/*.sha256.txt
            TestResults/*.trx
          if-no-files-found: ignore
