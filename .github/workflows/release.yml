name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - name: Install VS Code bridge dependencies
        working-directory: integrations/vscode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.2.1' }
          .\scripts\publish.ps1 -Version $version
      - name: Stability and resource gate
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.2.1' }
          $duration = if ($version.Contains('-') -or $version.StartsWith('0.')) { 60 } else { 300 }
          .\scripts\stability.ps1 -Version $version -DurationSeconds $duration
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Piko-win-x64
          path: |
            releases/*.zip
            releases/*-Setup.exe
            releases/*.vsix
            releases/update-manifest.json
            releases/stability-report-*.json
            releases/*.sha256.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            releases/*.zip
            releases/*-Setup.exe
            releases/*.vsix
            releases/update-manifest.json
            releases/stability-report-*.json
            releases/*.sha256.txt
